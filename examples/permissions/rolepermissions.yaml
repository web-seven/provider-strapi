# RolePermissions manages the permission set of an existing
# users-permissions role in Strapi v4. The role itself is not created or
# deleted by this resource — only its permission tree is managed.
#
# Built-in roles are matched by `role.type`:
#   public        → Strapi's "Public" role (anonymous /api/* access)
#   authenticated → Strapi's "Authenticated" role (logged-in /api/* access)
# Other values are matched against role.name (case-insensitive).
#
# The permissions list is authoritative — Strapi's PUT replaces the entire
# tree, so anything not listed is revoked on the next reconcile.
#
# Permission action format:
#   plugin::<plugin>.<controller>.<action>      — controller explicit
#   api::<api>.<contentType>.<action>           — controller implicit (= contentType)
#
# A fresh Strapi instance ships with the users-permissions plugin actions
# below; api::* actions only exist after you create a content type.

apiVersion: permissions.strapi.crossplane.io/v1alpha1
kind: RolePermissions
metadata:
  name: public
  namespace: default
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: example
  forProvider:
    role: public
    permissions:
      - plugin::users-permissions.auth.callback
      - plugin::users-permissions.auth.register
      - plugin::upload.content-api.find
      - plugin::upload.content-api.findOne
      # Add api::* actions once a content type exists, e.g.:
      # - api::article.article.find
      # - api::article.article.findOne
---
apiVersion: permissions.strapi.crossplane.io/v1alpha1
kind: RolePermissions
metadata:
  name: authenticated
  namespace: default
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: example
  forProvider:
    role: authenticated
    permissions:
      - plugin::users-permissions.user.me
      - plugin::users-permissions.auth.changePassword
---
# Crossplane v2.2 ergonomics: omit providerConfigRef entirely to use the
# ClusterProviderConfig named "default" (the v2.2 platform default).
apiVersion: permissions.strapi.crossplane.io/v1alpha1
kind: RolePermissions
metadata:
  name: public-default-provider
  namespace: default
spec:
  forProvider:
    role: public
    permissions:
      - plugin::users-permissions.auth.callback
      - plugin::users-permissions.auth.register
