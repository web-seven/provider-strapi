# Example ProviderConfig wired to the in-cluster Strapi deployed by the
# `cluster/charts/strapi` Helm chart (see `make serve`). The chart writes
# the admin credentials Secret in the `strapi` namespace; ProviderConfig
# references it cross-namespace via secretRef.namespace.
#
# To point at your own Strapi instead: change `spec.endpoint` and the
# `secretRef` to a Secret you control. The Secret value at `key: credentials`
# must be a JSON object {"email":"...","password":"..."} that the provider
# exchanges for an admin JWT via POST /admin/login on first use.
apiVersion: strapi.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: example
  namespace: default
spec:
  endpoint: http://strapi.strapi.svc.cluster.local:1337
  credentials:
    source: Secret
    secretRef:
      namespace: strapi
      name: strapi-admin
      key: credentials
---
apiVersion: strapi.crossplane.io/v1alpha1
kind: ClusterProviderConfig
metadata:
  name: example
spec:
  endpoint: http://strapi.strapi.svc.cluster.local:1337
  credentials:
    source: Secret
    secretRef:
      namespace: strapi
      name: strapi-admin
      key: credentials
