apiVersion: v1
kind: Namespace
metadata:
  name: default
---
# The credentials secret must contain a JSON object with the admin
# user's email and password. The provider exchanges these for an admin
# JWT via POST /admin/login on first use.
#
# The base64-encoded value below decodes to:
#   {"email":"admin@example.com","password":"ChangeMe123"}
# Note: Strapi enforces password complexity (uppercase + digit) on
# /admin/register-admin; weaker passwords will fail the chart's bootstrap Job.
apiVersion: v1
kind: Secret
metadata:
  namespace: default
  name: example-provider-secret
type: Opaque
data:
  credentials: eyJlbWFpbCI6ImFkbWluQGV4YW1wbGUuY29tIiwicGFzc3dvcmQiOiJDaGFuZ2VNZTEyMyJ9
---
apiVersion: strapi.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: example
  namespace: default
spec:
  endpoint: https://strapi.example.com
  credentials:
    source: Secret
    secretRef:
      namespace: default
      name: example-provider-secret
      key: credentials
---
apiVersion: strapi.crossplane.io/v1alpha1
kind: ClusterProviderConfig
metadata:
  name: example
spec:
  endpoint: https://strapi.example.com
  credentials:
    source: Secret
    secretRef:
      namespace: default
      name: example-provider-secret
      key: credentials
