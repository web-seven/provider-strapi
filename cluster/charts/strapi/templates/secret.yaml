apiVersion: v1
kind: Secret
metadata:
  name: {{ include "strapi.fullname" . }}-env
  labels: {{- include "strapi.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_KEYS: {{ .Values.applicationSecret.appKeys | quote }}
  API_TOKEN_SALT: {{ .Values.applicationSecret.apiTokenSalt | quote }}
  ADMIN_JWT_SECRET: {{ .Values.applicationSecret.adminJwtSecret | quote }}
  JWT_SECRET: {{ .Values.applicationSecret.jwtSecret | quote }}
  TRANSFER_TOKEN_SALT: {{ .Values.applicationSecret.transferTokenSalt | quote }}
---
# Admin credentials in the JSON shape this provider's ProviderConfig consumes.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "strapi.fullname" . }}-admin
  labels: {{- include "strapi.labels" . | nindent 4 }}
type: Opaque
stringData:
  email: {{ .Values.admin.email | quote }}
  password: {{ .Values.admin.password | quote }}
  credentials: {{ printf `{"email":%q,"password":%q}` .Values.admin.email .Values.admin.password | quote }}
