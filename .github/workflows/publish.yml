name: Publish Provider Package

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.23'
  DOCKER_BUILDX_VERSION: 'v0.23.0'

  # Major versions whose releases are also published to the marketplace,
  # e.g. '["v0", "v2"]'. Every release is published to ghcr.io.
  MARKETPLACE_MAJOR_VERSIONS: '["v0"]'
  GHCR_REGISTRY: ghcr.io/web-seven

  # Copy secrets to env so we can test for their presence without
  # 'secrets.XXX != ""' (which is not allowed in 'if' expressions).
  XPKG_ACCESS_ID: ${{ secrets.XPKG_ACCESS_ID }}

jobs:
  publish-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      marketplace: ${{ steps.version.outputs.marketplace }}

    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Login to Upbound Marketplace
        uses: docker/login-action@v1
        if: env.XPKG_ACCESS_ID != ''
        with:
          registry: xpkg.upbound.io
          username: ${{ secrets.XPKG_ACCESS_ID }}
          password: ${{ secrets.XPKG_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Fetch History
        run: git fetch --prune --unshallow

      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Find the Go Build Cache
        id: go
        run: echo "cachedir=$(make go.cachedir)" >> $GITHUB_ENV

      - name: Cache the Go Build Cache
        uses: actions/cache@v5
        with:
          path: ${{ env.cachedir }}
          key: ${{ runner.os }}-build-release-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-release-

      - name: Cache Go Dependencies
        uses: actions/cache@v5
        with:
          path: .work/pkg
          key: ${{ runner.os }}-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-pkg-

      - name: Download Go Modules
        run: make modules.download modules.check

      - name: Resolve release version
        id: version
        run: |
          TAG=${GITHUB_REF##*/}
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG}" >> $GITHUB_OUTPUT
          if jq -e --arg major "${TAG%%.*}" 'any(.[]; . == $major)' <<< "$MARKETPLACE_MAJOR_VERSIONS" > /dev/null; then
            echo "marketplace=true" >> $GITHUB_OUTPUT
          else
            echo "marketplace=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Artifacts
        run: make -j2 build.all
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_ARGS: "--load"

      - name: Publish Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.tag }}
          path: _output/**

      - name: Publish to Upbound Marketplace
        if: env.XPKG_ACCESS_ID != '' && steps.version.outputs.marketplace == 'true'
        # BRANCH_NAME must match xpkg.mk's RELEASE_BRANCH_FILTER or publish.artifacts is a silent no-op.
        run: make publish BRANCH_NAME=main
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to ghcr.io
        # BRANCH_NAME must match xpkg.mk's RELEASE_BRANCH_FILTER or publish.artifacts is a silent no-op.
        run: make publish BRANCH_NAME=main XPKG_REG_ORGS=${GHCR_REGISTRY} XPKG_REG_ORGS_NO_PROMOTE=${GHCR_REGISTRY}
        env:
          VERSION: ${{ steps.version.outputs.version }}

  append-marketplace-extensions:
    needs: publish-release
    runs-on: ubuntu-22.04
    if: ${{ needs.publish-release.result == 'success' && needs.publish-release.outputs.marketplace == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install up CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL https://cli.upbound.io | UP_CHANNEL=stable sh
          mv up "$HOME/.local/bin/up"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show up version
        run: up version

      - name: Login to Upbound Marketplace
        if: env.XPKG_ACCESS_ID != ''
        uses: docker/login-action@v3
        with:
          registry: xpkg.upbound.io
          username: ${{ secrets.XPKG_ACCESS_ID }}
          password: ${{ secrets.XPKG_TOKEN }}

      - name: Append marketplace extensions
        if: env.XPKG_ACCESS_ID != ''
        run: make publish.extensions
        env:
          VERSION: ${{ needs.publish-release.outputs.version }}

  github-release:
    needs: publish-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.publish-release.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists"
            exit 0
          fi
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            "${prerelease[@]}"
