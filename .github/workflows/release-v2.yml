# Publish the provider package to ghcr.io and create a GitHub Release for
# v2.x.x tags. Other v* tags are published to the Upbound Marketplace by
# publish.yml.
#
# Push tags with your own credentials (`git push origin v2.0.0`): tags
# created by a workflow using GITHUB_TOKEN, such as the Tag workflow, don't
# trigger other workflows.

name: Release v2

on:
  push:
    tags:
      - 'v2.[0-9]+.[0-9]+'
      - 'v2.[0-9]+.[0-9]+-*'

env:
  DOCKER_BUILDX_VERSION: 'v0.23.0'
  XPKG_REGISTRY: ghcr.io/web-seven
  XPKG_NAME: provider-strapi

permissions:
  contents: read

jobs:
  publish-package:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Fetch History
        run: git fetch --prune --unshallow

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Find the Go Build Cache
        id: go
        run: echo "cachedir=$(make go.cachedir)" >> $GITHUB_ENV

      - name: Cache the Go Build Cache
        uses: actions/cache@v5
        with:
          path: ${{ env.cachedir }}
          key: ${{ runner.os }}-build-release-v2-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-release-v2-

      - name: Cache Go Dependencies
        uses: actions/cache@v5
        with:
          path: .work/pkg
          key: ${{ runner.os }}-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-pkg-

      - name: Download Go Modules
        run: make modules.download modules.check

      - name: Resolve release version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build Artifacts
        run: make -j2 build.all
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # docker buildx doesn't load the images it builds unless asked to,
          # and xpkg build embeds them from the local daemon.
          BUILD_ARGS: "--load"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push package to ghcr.io
        # BRANCH_NAME must match xpkg.mk's RELEASE_BRANCH_FILTER or publish is a silent no-op.
        run: make publish BRANCH_NAME=main XPKG_REG_ORGS=${XPKG_REGISTRY} XPKG_REG_ORGS_NO_PROMOTE=${XPKG_REGISTRY}
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Collect release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p _release
          # Every platform's package has the same file name, so qualify it.
          for f in _output/xpkg/*/${XPKG_NAME}-${VERSION}.xpkg; do
            platform=$(basename "$(dirname "$f")")
            cp "$f" "_release/${XPKG_NAME}-${VERSION}-${platform}.xpkg"
          done
          ls _release/*.xpkg
          (cd _release && sha256sum -- *.xpkg > checksums.txt)

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: _release/*
          if-no-files-found: error

  github-release:
    needs: publish-package
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: _release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish-package.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo '## Install'
            echo
            echo '```yaml'
            echo 'apiVersion: pkg.crossplane.io/v1'
            echo 'kind: Provider'
            echo 'metadata:'
            echo "  name: ${XPKG_NAME}"
            echo 'spec:'
            echo "  package: ${XPKG_REGISTRY}/${XPKG_NAME}:${VERSION}"
            echo '```'
          } > notes.md

          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Re-run of the workflow: refresh the assets of the existing release.
            gh release upload "$VERSION" _release/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi

          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$VERSION" _release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$VERSION" \
            --notes-file notes.md \
            --generate-notes \
            "${prerelease[@]}"
