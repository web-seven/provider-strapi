---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: backups.backups.strapi.crossplane.io
spec:
  group: backups.strapi.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - strapi
    kind: Backup
    listKind: BackupList
    plural: backups
    singular: backup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.forProvider.schedule
      name: SCHEDULE
      type: string
    - jsonPath: .status.atProvider.lastBackupTime
      name: LAST-BACKUP
      type: date
    - jsonPath: .status.atProvider.nextBackupTime
      name: NEXT-BACKUP
      type: date
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v2alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Backup dumps a Strapi project's entities, relations and configuration (and
          optionally its media assets) to an S3-compatible bucket on a cron
          schedule, using Strapi's remote data-transfer "pull" endpoint.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A BackupSpec defines the desired state of a Backup.
            properties:
              forProvider:
                description: BackupParameters are the configurable fields of a Backup.
                properties:
                  destination:
                    description: Destination is the bucket a backup is written to.
                    properties:
                      bucket:
                        description: |-
                          Bucket is the name of the destination bucket. It must already exist;
                          this resource does not manage bucket lifecycle.
                        minLength: 1
                        type: string
                      credentials:
                        description: Credentials used to write to the bucket.
                        properties:
                          env:
                            description: |-
                              Env is a reference to an environment variable that contains credentials
                              that must be used to connect to the provider.
                            properties:
                              name:
                                description: Name is the name of an environment variable.
                                type: string
                            required:
                            - name
                            type: object
                          fs:
                            description: |-
                              Fs is a reference to a filesystem location that contains credentials that
                              must be used to connect to the provider.
                            properties:
                              path:
                                description: Path is a filesystem path.
                                type: string
                            required:
                            - path
                            type: object
                          secretRef:
                            description: |-
                              A SecretRef is a reference to a secret key that contains the credentials
                              that must be used to connect to the provider.
                            properties:
                              key:
                                description: The key to select.
                                type: string
                              name:
                                description: Name of the secret.
                                type: string
                              namespace:
                                description: Namespace of the secret.
                                type: string
                            required:
                            - key
                            - name
                            - namespace
                            type: object
                          source:
                            description: Source of the bucket credentials.
                            enum:
                            - InjectedIdentity
                            - Secret
                            type: string
                        required:
                        - source
                        type: object
                      endpoint:
                        description: |-
                          Endpoint overrides the default AWS S3 endpoint, e.g.
                          "https://minio.example.com" or an R2/GCS S3-compatible endpoint.
                          Leave empty to use AWS S3.
                        type: string
                      forcePathStyle:
                        description: |-
                          ForcePathStyle addresses the bucket as
                          "<endpoint>/<bucket>/<key>" instead of "<bucket>.<endpoint>/<key>".
                          Most S3-compatible services other than AWS require this.
                        type: boolean
                      path:
                        description: |-
                          Path is a key prefix under which backup objects are written, e.g.
                          "production". Defaults to the bucket root.
                        type: string
                      region:
                        description: |-
                          Region is the bucket's region, e.g. "us-east-1". Required by the S3
                          API even for S3-compatible services that don't use AWS regions.
                        type: string
                    required:
                    - bucket
                    - credentials
                    type: object
                  includeAssets:
                    description: |-
                      IncludeAssets additionally pulls uploaded media files into the
                      backup. Disabled by default, since self-hosted Strapi instances
                      commonly already store media in object storage directly (via the
                      upload provider), making a second copy through this resource
                      redundant.
                    type: boolean
                  retentionDays:
                    description: |-
                      RetentionDays prunes backups older than this many days from the
                      destination after each successful backup. Zero (the default) keeps
                      every backup indefinitely; use bucket lifecycle rules instead if
                      that's a better fit for your storage backend.
                    format: int32
                    minimum: 0
                    type: integer
                  schedule:
                    description: |-
                      Schedule is a standard 5-field cron expression (minute hour
                      day-of-month month day-of-week) in UTC, e.g. "0 2 * * *" for daily at
                      02:00. A backup is taken the first time it comes due after the
                      resource is created or after the previous backup completed.
                    minLength: 1
                    type: string
                  transferTokenSecretRef:
                    description: |-
                      TransferTokenSecretRef references a Secret containing a Strapi
                      transfer token scoped to "pull" (Settings > Transfer Tokens in the
                      Strapi admin panel). This is distinct from the admin email/password
                      on the ProviderConfig: Strapi's remote data-transfer endpoint
                      authenticates with a transfer token, not an admin session.
                    properties:
                      key:
                        description: The key to select.
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                      namespace:
                        description: Namespace of the secret.
                        type: string
                    required:
                    - key
                    - name
                    - namespace
                    type: object
                required:
                - destination
                - schedule
                - transferTokenSecretRef
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: A BackupStatus represents the observed state of a Backup.
            properties:
              atProvider:
                description: BackupObservation are the observable fields of a Backup.
                properties:
                  lastBackupAssets:
                    description: |-
                      LastBackupAssets is the number of media assets captured by the most
                      recent backup, when includeAssets is enabled.
                    format: int64
                    type: integer
                  lastBackupEntities:
                    description: |-
                      LastBackupEntities is the number of entity records captured by the
                      most recent backup.
                    format: int64
                    type: integer
                  lastBackupKey:
                    description: |-
                      LastBackupKey is the destination key prefix the most recent backup
                      was written under.
                    type: string
                  lastBackupSizeBytes:
                    description: |-
                      LastBackupSizeBytes is the total size of the objects written by the
                      most recent backup.
                    format: int64
                    type: integer
                  lastBackupTime:
                    description: LastBackupTime is when the most recent successful
                      backup completed.
                    format: date-time
                    type: string
                  nextBackupTime:
                    description: NextBackupTime is when the next backup is due.
                    format: date-time
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
