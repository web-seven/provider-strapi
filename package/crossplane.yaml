apiVersion: meta.pkg.crossplane.io/v1alpha1
kind: Provider
metadata:
  name: provider-strapi
  annotations:
    meta.crossplane.io/maintainer: web-seven <info@web-seven.io>
    meta.crossplane.io/source: github.com/web-seven/provider-strapi
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      Crossplane provider for Strapi v4. Manages Strapi users-permissions
      roles and their permission sets declaratively via Kubernetes custom
      resources.
    meta.crossplane.io/readme: |
      # provider-strapi

      A [Crossplane](https://crossplane.io) provider that manages
      [Strapi v4](https://strapi.io) resources declaratively as Kubernetes
      custom resources.

      ## Features

      - **RolePermissions** — declare the full permission set for a
        Strapi users-permissions role (built-in `Public`/`Authenticated`
        resolved by type, custom roles by name). Strapi's `PUT` is
        full-replace, so the spec's `permissions` list is always authoritative.
      - **ProviderConfig / ClusterProviderConfig** — supply Strapi endpoint
        and admin credentials (email + password) via a Kubernetes Secret.
        Supports optional `insecureSkipTLSVerify` for self-signed certificates.

      ## Getting started

      ```yaml
      apiVersion: strapi.crossplane.io/v1alpha1
      kind: ClusterProviderConfig
      metadata:
        name: default
      spec:
        endpoint: https://strapi.example.com
        credentials:
          source: Secret
          secretRef:
            namespace: crossplane-system
            name: strapi-creds
            key: credentials
      ```

      The secret payload must be JSON: `{"email":"admin@example.com","password":"..."}`.

      ## Managed resources

      | Kind | Group | Scope |
      |------|-------|-------|
      | RolePermissions | permissions.strapi.crossplane.io | Namespaced |
      | ProviderConfig | strapi.crossplane.io | Namespaced |
      | ClusterProviderConfig | strapi.crossplane.io | Cluster |
    meta.crossplane.io/category: application
    meta.crossplane.io/icon-data-uri: data:image/svg+xml;base64,
spec: {}
